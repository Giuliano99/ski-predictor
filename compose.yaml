services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ski_data
      POSTGRES_USER: ski_app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ski_predictor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ski_app -d ski_data"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ski_predictor_postgres:

